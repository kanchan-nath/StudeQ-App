version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.17.0

    steps:
      - checkout

      - run:
          name: Build and test all projects
          command: |
            for dir in server client app-studeq; do
              echo "========================"
              echo "Processing $dir"
              echo "========================"

              if [ ! -f "$dir/package.json" ]; then
                echo "Skipping $dir (no package.json)"
                continue
              fi

              cd "$dir"

              echo "Installing dependencies..."

              if [ "$dir" = "server" ]; then
                npm ci --legacy-peer-deps
              else
                npm ci
              fi

              echo "Checking for build script..."
              if npm run | grep -q " build"; then
                npm run build
              else
                echo "No build script."
              fi

              echo "Checking for test script..."
              if npm run | grep -q " test"; then
                npm test
              else
                echo "No test script."
              fi

              cd ..
            done

workflows:
  version: 2

  build:
    jobs:
      - build