<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0B1F"/>
      <stop offset="50%" style="stop-color:#1A1235"/>
      <stop offset="100%" style="stop-color:#0D0A1E"/>
    </linearGradient>
    <linearGradient id="flashcardGrad" x1="0%" y1="0%" x2="100%" y2="200%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="flashcardGrad2" x1="0%" y1="0%" x2="100%" y2="200%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FBBF24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Top glow line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- Subtle background orbs -->
  <circle cx="200" cy="500" r="220" fill="#F59E0B" opacity="0.04"/>
  <circle cx="1000" cy="100" r="200" fill="#FBBF24" opacity="0.04"/>
  <circle cx="600" cy="315" r="350" fill="#F59E0B" opacity="0.02"/>

  <!-- LEFT SIDE: Flashcard Visual (dominant ~45% canvas) -->
  <g transform="translate(180, 315)">
    
    <!-- Floating cards stack - 3D effect -->
    <!-- Back card -->
    <g transform="rotate(-8) translate(-40, -30)" filter="url(#cardShadow)">
      <rect x="-90" y="-120" width="180" height="240" rx="14" fill="#1A1235" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
      <rect x="-75" y="-105" width="150" height="50" rx="6" fill="#F59E0B" opacity="0.05"/>
      <text x="-55" y="-75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#FBBF24" opacity="0.3">Question</text>
      <line x1="-75" y1="-45" x2="75" y2="-45" stroke="#F59E0B" stroke-width="0.5" opacity="0.1"/>
      <text x="-55" y="-20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FBBF24" opacity="0.2">Answer</text>
    </g>

    <!-- Middle card -->
    <g transform="rotate(-4) translate(-20, -15)" filter="url(#cardShadow)">
      <rect x="-90" y="-120" width="180" height="240" rx="14" fill="#1A1235" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
      <rect x="-75" y="-105" width="150" height="50" rx="6" fill="#FBBF24" opacity="0.08"/>
      <text x="-55" y="-75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#FCD34D" opacity="0.5">Question</text>
      <line x1="-75" y1="-45" x2="75" y2="-45" stroke="#FBBF24" stroke-width="0.5" opacity="0.15"/>
      <text x="-55" y="-20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FCD34D" opacity="0.4">Answer</text>
    </g>

    <!-- Front card - Main focus -->
    <g filter="url(#cardShadow)">
      <!-- Card body with gold gradient border -->
      <rect x="-100" y="-130" width="200" height="260" rx="16" fill="#1A1235" stroke="url(#flashcardGrad)" stroke-width="2.5"/>
      <rect x="-100" y="-130" width="200" height="260" rx="16" fill="url(#flashcardGrad)" opacity="0.06"/>
      
      <!-- Card header -->
      <rect x="-85" y="-112" width="170" height="42" rx="8" fill="#F59E0B" opacity="0.1"/>
      <text x="0" y="-86" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#FBBF24" text-anchor="middle" font-weight="700">Q: What is Spaced</text>
      <text x="0" y="-70" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#FBBF24" text-anchor="middle" font-weight="700">Repetition?</text>
      
      <!-- Divider -->
      <line x1="-75" y1="-52" x2="75" y2="-52" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
      
      <!-- Answer section -->
      <text x="0" y="-28" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#C4B5FD" text-anchor="middle" font-weight="400" opacity="0.6">Answer</text>
      <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600">Reviewing</text>
      <text x="0" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600">information at</text>
      <text x="0" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600">increasing</text>
      <text x="0" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600">intervals. 📚</text>
      
      <!-- Status indicators -->
      <circle cx="-70" y="100" r="4" fill="#10B981" opacity="0.6"/>
      <text x="-60" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#34D399" font-weight="500">Easy</text>
      <circle cx="-10" y="100" r="4" fill="#F59E0B" opacity="0.6"/>
      <text x="0" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FCD34D" font-weight="500">Medium</text>
      <circle cx="50" y="100" r="4" fill="#F43F5E" opacity="0.6"/>
      <text x="60" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FB7185" font-weight="500">Hard</text>
    </g>

    <!-- Small sparkle accents -->
    <circle cx="-130" cy="-145" r="3" fill="#FBBF24" opacity="0.3"/>
    <circle cx="130" cy="-120" r="2" fill="#FBBF24" opacity="0.2"/>
    <circle cx="-135" cy="120" r="2.5" fill="#FBBF24" opacity="0.25"/>
    <circle cx="125" cy="130" r="3" fill="#FBBF24" opacity="0.2"/>
  </g>

  <!-- RIGHT SIDE: Text Content (F-pattern, clear negative space) -->
  <g transform="translate(520, 50)">
    
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="30" rx="15" fill="url(#badgeGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="30" rx="15" fill="none" stroke="#A78BFA" stroke-width="1"/>
    <text x="70" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#A78BFA" text-anchor="middle" font-weight="700" letter-spacing="1">⭐ AI FLASHCARDS</text>

    <!-- Main bold headline - dominant, max 6-8 words -->
    <text x="0" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="60" fill="#FFFFFF" font-weight="900" letter-spacing="-1">
      Turn Notes Into
    </text>
    <text x="0" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="60" fill="url(#flashcardGrad)" font-weight="900" letter-spacing="-1">
      Smart Decks
    </text>

    <!-- Decorative underline -->
    <rect x="0" y="158" width="200" height="4" rx="2" fill="url(#flashcardGrad)" opacity="0.6"/>
    <rect x="0" y="158" width="80" height="4" rx="2" fill="url(#flashcardGrad2)" opacity="0.9"/>

    <!-- Description - supporting text -->
    <text x="0" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      Generate smart flashcard decks from any
    </text>
    <text x="0" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      notes or PDF. Spaced repetition helps
    </text>
    <text x="0" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      you retain more in less time. 🚀
    </text>

    <!-- Feature chips -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1A1235" stroke="#7C3AED" stroke-width="1" opacity="0.8"/>
      <text x="65" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#A78BFA" text-anchor="middle" font-weight="600">Six Study Modes</text>

      <rect x="145" y="0" width="155" height="32" rx="16" fill="#1A1235" stroke="#10B981" stroke-width="1" opacity="0.8"/>
      <text x="222" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#34D399" text-anchor="middle" font-weight="600">AI Mastery Tracking</text>

      <rect x="0" y="45" width="140" height="32" rx="16" fill="#1A1235" stroke="#F59E0B" stroke-width="1" opacity="0.8"/>
      <text x="70" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#FBBF24" text-anchor="middle" font-weight="600">Spaced Repetition</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="230" height="52" rx="26" fill="url(#accentGrad)" filter="url(#glow)"/>
      <text x="115" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Generate Your Deck →</text>
    </g>
  </g>

  <!-- Bottom right brand -->
  <text x="1140" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5B21B6" text-anchor="end" font-weight="600" letter-spacing="3" opacity="0.5">STUDEQ</text>

  <!-- Corner decorations -->
  <rect x="20" y="20" width="40" height="3" rx="1.5" fill="#F59E0B" opacity="0.3"/>
  <rect x="20" y="20" width="3" height="40" rx="1.5" fill="#F59E0B" opacity="0.3"/>
  <rect x="1140" y="20" width="40" height="3" rx="1.5" fill="#F59E0B" opacity="0.3"/>
  <rect x="1177" y="20" width="3" height="40" rx="1.5" fill="#F59E0B" opacity="0.3"/>
</svg>