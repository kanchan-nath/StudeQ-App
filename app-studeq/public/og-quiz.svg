<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0B1F"/>
      <stop offset="50%" style="stop-color:#1A1235"/>
      <stop offset="100%" style="stop-color:#0D0A1E"/>
    </linearGradient>
    <linearGradient id="quizGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
    <linearGradient id="quizGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#F472B6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="correctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="wrongGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F43F5E"/>
      <stop offset="100%" style="stop-color:#E11D48"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="10" flood-color="#EC4899" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Top glow line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- Subtle background orbs -->
  <circle cx="200" cy="500" r="220" fill="#EC4899" opacity="0.04"/>
  <circle cx="1000" cy="100" r="200" fill="#F472B6" opacity="0.04"/>
  <circle cx="600" cy="315" r="350" fill="#EC4899" opacity="0.02"/>

  <!-- LEFT SIDE: Quiz Interface Visual (dominant ~45% canvas) -->
  <g transform="translate(180, 315)">
    
    <!-- Quiz container -->
    <rect x="-110" y="-140" width="220" height="280" rx="16" fill="#1A1235" stroke="#EC4899" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="-110" y="-140" width="220" height="280" rx="16" fill="url(#quizGrad1)" opacity="0.04"/>
    
    <!-- Quiz header -->
    <rect x="-110" y="-140" width="220" height="40" rx="16" fill="#EC4899" opacity="0.12"/>
    <rect x="-110" y="-108" width="220" height="8" fill="#1A1235"/>
    
    <!-- Progress indicators -->
    <text x="-90" y="-118" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#F472B6" font-weight="600">📝 Quiz</text>
    <text x="80" y="-118" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C4B5FD" text-anchor="end" font-weight="400">3/10</text>
    
    <!-- Progress bar -->
    <rect x="-90" y="-105" width="180" height="4" rx="2" fill="#1A1235"/>
    <rect x="-90" y="-105" width="54" height="4" rx="2" fill="url(#quizGrad1)"/>

    <!-- Question -->
    <text x="0" y="-75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">
      What is backpropagation?
    </text>
    
    <!-- Answer options -->
    <!-- Option A - Correct -->
    <g transform="translate(-90, -55)">
      <rect x="0" y="0" width="180" height="28" rx="8" fill="#10B981" opacity="0.12"/>
      <rect x="0" y="0" width="180" height="28" rx="8" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="15" cy="14" r="8" fill="#10B981" opacity="0.2"/>
      <circle cx="15" cy="14" r="4" fill="#10B981"/>
      <text x="30" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#34D399" font-weight="500">A. Algorithm that optimizes weights</text>
    </g>

    <!-- Option B - Wrong -->
    <g transform="translate(-90, -20)">
      <rect x="0" y="0" width="180" height="28" rx="8" fill="#F43F5E" opacity="0.08"/>
      <rect x="0" y="0" width="180" height="28" rx="8" stroke="#F43F5E" stroke-width="1" opacity="0.5"/>
      <circle cx="15" cy="14" r="8" fill="#F43F5E" opacity="0.1"/>
      <circle cx="15" cy="14" r="4" fill="#F43F5E" opacity="0.3"/>
      <text x="30" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#FB7185" font-weight="400">B. A type of neural network</text>
    </g>

    <!-- Option C -->
    <g transform="translate(-90, 15)">
      <rect x="0" y="0" width="180" height="28" rx="8" fill="#1A1235" stroke="#5B21B6" stroke-width="1" opacity="0.8"/>
      <circle cx="15" cy="14" r="8" fill="#1A1235" stroke="#5B21B6" stroke-width="1"/>
      <text x="30" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#C4B5FD" font-weight="400">C. Training data preprocessing</text>
    </g>

    <!-- Option D -->
    <g transform="translate(-90, 50)">
      <rect x="0" y="0" width="180" height="28" rx="8" fill="#1A1235" stroke="#5B21B6" stroke-width="1" opacity="0.8"/>
      <circle cx="15" cy="14" r="8" fill="#1A1235" stroke="#5B21B6" stroke-width="1"/>
      <text x="30" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#C4B5FD" font-weight="400">D. Model evaluation metric</text>
    </g>

    <!-- Explanation bubble -->
    <g transform="translate(-90, 90)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#7C3AED" opacity="0.08"/>
      <text x="10" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#A78BFA" font-weight="600">💡 Explanation</text>
      <text x="10" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#C4B5FD" font-weight="400">Backpropagation adjusts weights to</text>
      <text x="10" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#C4B5FD" font-weight="400">minimize error in neural networks.</text>
    </g>

    <!-- Question type indicator -->
    <g transform="translate(-75, 140)">
      <rect x="0" y="0" width="150" height="18" rx="9" fill="#EC4899" opacity="0.08"/>
      <text x="75" y="13" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#F472B6" text-anchor="middle" font-weight="600">Multiple Choice · Adaptive</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Text Content (F-pattern, clear negative space) -->
  <g transform="translate(545, 50)">
    
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="30" rx="15" fill="url(#badgeGrad)" opacity="0.12"/>
    <rect x="0" y="0" width="160" height="30" rx="15" fill="none" stroke="#F472B6" stroke-width="1"/>
    <text x="80" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#F472B6" text-anchor="middle" font-weight="700" letter-spacing="1">🎯 AI QUIZ MAKER</text>

    <!-- Main bold headline - dominant -->
    <text x="0" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="60" fill="#FFFFFF" font-weight="900" letter-spacing="-1">
      Generate Quizzes
    </text>
    <text x="0" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="60" fill="url(#badgeGrad)" font-weight="900" letter-spacing="-1">
      From Any Notes
    </text>

    <!-- Decorative underline -->
    <rect x="0" y="163" width="210" height="4" rx="2" fill="url(#badgeGrad)" opacity="0.6"/>
    <rect x="0" y="163" width="85" height="4" rx="2" fill="url(#quizGrad2)" opacity="0.9"/>

    <!-- Description -->
    <text x="0" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      Generate smart quizzes from your
    </text>
    <text x="0" y="233" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      notes, PDFs, or any topic. Multiple
    </text>
    <text x="0" y="261" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#C4B5FD" font-weight="400" opacity="0.9">
      question types with instant AI explanations. 🚀
    </text>

    <!-- Feature chips -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#1A1235" stroke="#EC4899" stroke-width="1" opacity="0.8"/>
      <text x="77" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#F472B6" text-anchor="middle" font-weight="600">Multiple Question Types</text>

      <rect x="170" y="0" width="155" height="32" rx="16" fill="#1A1235" stroke="#10B981" stroke-width="1" opacity="0.8"/>
      <text x="247" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#34D399" text-anchor="middle" font-weight="600">Adaptive Difficulty</text>

      <rect x="0" y="45" width="170" height="32" rx="16" fill="#1A1235" stroke="#8B5CF6" stroke-width="1" opacity="0.8"/>
      <text x="85" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#A78BFA" text-anchor="middle" font-weight="600">Instant AI Explanations</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="240" height="52" rx="26" fill="url(#accentGrad)" filter="url(#glow)"/>
      <text x="120" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Start a Quiz →</text>
    </g>
  </g>

  <!-- Bottom right brand -->
  <text x="1140" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5B21B6" text-anchor="end" font-weight="600" letter-spacing="3" opacity="0.5">STUDEQ</text>

  <!-- Corner decorations -->
  <rect x="20" y="20" width="40" height="3" rx="1.5" fill="#EC4899" opacity="0.3"/>
  <rect x="20" y="20" width="3" height="40" rx="1.5" fill="#EC4899" opacity="0.3"/>
  <rect x="1140" y="20" width="40" height="3" rx="1.5" fill="#EC4899" opacity="0.3"/>
  <rect x="1177" y="20" width="3" height="40" rx="1.5" fill="#EC4899" opacity="0.3"/>
</svg>