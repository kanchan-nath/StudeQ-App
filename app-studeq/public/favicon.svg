  <circle cx="60" cy="56" r="28" fill="none" stroke="#ffd166" stroke-width="13"/>
  <line x1="72" y1="70" x2="92" y2="90" stroke="#ffd166" stroke-width="13" stroke-linecap="round"/>
</svg>
