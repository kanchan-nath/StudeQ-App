<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- BACKGROUND: near-black circle for contrast, keeps focal shape contained -->
  <g id="background">
    <circle cx="100" cy="100" r="96" fill="#0a0c14"/>
  </g>

  <!-- PRIMARY SHAPE: Q as book-page curl with upward arrow/spark dual-meaning -->
  <g id="primary-shape" fill="#ffd166">
    <!-- Q circle body — bold thick ring (book/page metaphor) -->
    <path d="M100 28 C60.2 28 28 60.2 28 100 C28 139.8 60.2 172 100 172 C120.4 172 139.2 163.4 152.8 149.6 L149.6 146.4 C137.2 158.8 119.8 166 100 166 C63.6 166 34 136.4 34 100 C34 63.6 63.6 34 100 34 C136.4 34 166 63.6 166 100 C166 112.8 162.4 124.6 156.2 134.6 L160.4 138.8 C167.6 127.4 172 114.2 172 100 C172 60.2 139.8 28 100 28Z"/>

    <!-- Q tail — curls like a book page turning, doubles as upward arrow/check mark -->
    <path d="M152.8 149.6 L176 172 L168 180 L144.8 156.8 L152.8 149.6Z"/>
    <path d="M144.8 156.8 L158 143.6 L165.6 151.2 L152.4 164.4 L144.8 156.8Z"/>

    <!-- Inner cutout — negative space creates book spread illusion -->
    <path d="M100 46 C70.2 46 46 70.2 46 100 C46 129.8 70.2 154 100 154 C114.2 154 127.2 148.4 136.8 139.6 L130.8 133.6 C122.4 141 110.8 146 100 146 C74.6 146 54 125.4 54 100 C54 74.6 74.6 54 100 54 C125.4 54 146 74.6 146 100 C146 106.8 144.2 113.2 141 118.8 L147.2 125 C151.4 118 154 110 154 100 C154 70.2 129.8 46 100 46Z"/>

    <!-- Horizontal page line / book spine — anchors the study/book metaphor -->
    <path d="M54 104 L146 104 L146 110 L54 110 L54 104Z"/>
  </g>

  <!-- ACCENT NODE: purple spark/neural node at the arrow tip — AI touch -->
  <g id="accent-node" fill="#7c5ff5">
    <!-- Glowing node dot -->
    <circle cx="172" cy="176" r="8"/>

    <!-- Small spark rays from node -->
    <path d="M172 162 L172 168 L172 162Z"/>
    <path d="M186 176 L180 176 L186 176Z"/>
    <path d="M158 176 L164 176 L158 176Z"/>
    <path d="M178 164 L174 168 L178 164Z"/>
    <path d="M166 168 L170 172 L166 168Z"/>
    <path d="M178 188 L174 184 L178 188Z"/>
    <path d="M166 184 L170 180 L166 184Z"/>
  </g>
</svg>