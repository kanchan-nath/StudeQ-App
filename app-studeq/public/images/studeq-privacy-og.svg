<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F23"/>
      <stop offset="50%" stop-color="#1A1A3E"/>
      <stop offset="100%" stop-color="#0D0D2B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B5CFC"/>
      <stop offset="100%" stop-color="#4F3CF5"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4CCFF"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5CFC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B5CFC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7B5CFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.36  0 0 0 0 0.99  0 0 0 0.2 0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#7B5CFC" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Ambient glow behind icon -->
  <ellipse cx="850" cy="315" rx="230" ry="210" fill="#7B5CFC" opacity="0.06" filter="url(#softGlow)"/>

  <!-- ==================== ICON: DOCUMENT-SHIELD ==================== -->
  <g filter="url(#glow)">
    <!-- Shield outer -->
    <path d="M850 90Q990 145 990 345Q990 515 850 570Q710 515 710 345Q710 145 850 90Z"
          fill="url(#shieldGrad)" opacity="0.12" stroke="#7B5CFC" stroke-width="2.5"/>

    <!-- Shield body -->
    <path d="M850 125Q960 170 960 345Q960 490 850 535Q740 490 740 345Q740 170 850 125Z"
          fill="url(#shieldGrad)" opacity="0.85" stroke="#A78BFA" stroke-width="1.8"/>

    <!-- Shield highlight -->
    <path d="M850 125Q960 170 960 345Q960 490 850 535"
          fill="none" stroke="#C4B5FD" stroke-width="1.2" opacity="0.3"/>

    <!-- Document inside shield -->
    <g transform="translate(850, 310)">
      <rect x="-60" y="-55" width="120" height="140" rx="9" fill="url(#docGrad)" opacity="0.95"/>

      <!-- Document fold -->
      <path d="M38 -55L60 -33L60 -55Z" fill="#D4CCFF" opacity="0.6"/>

      <!-- Document text lines -->
      <rect x="-40" y="-30" width="60" height="7" rx="3.5" fill="#4F3CF5" opacity="0.5"/>
      <rect x="-40" y="-13" width="78" height="7" rx="3.5" fill="#4F3CF5" opacity="0.35"/>
      <rect x="-40" y="4" width="65" height="7" rx="3.5" fill="#4F3CF5" opacity="0.35"/>
      <rect x="-40" y="21" width="73" height="7" rx="3.5" fill="#4F3CF5" opacity="0.3"/>
      <rect x="-40" y="38" width="52" height="7" rx="3.5" fill="#4F3CF5" opacity="0.25"/>

      <!-- Checkmark badge -->
      <circle cx="60" cy="-55" r="20" fill="#7B5CFC"/>
      <circle cx="60" cy="-55" r="20" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5"/>
      <polyline points="51,-55 57,-48 69,-62" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Lock on document -->
      <rect x="45" y="-8" width="20" height="16" rx="3.5" fill="#4F3CF5"/>
      <path d="M49 -8L49 -17A6 6 0 0 1 61 -17L61 -8"
            fill="none" stroke="#4F3CF5" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="55" cy="3" r="3" fill="#FFFFFF" opacity="0.9"/>
      <rect x="53" y="3" width="4" height="5" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Decorative data dots -->
  <g opacity="0.4">
    <circle cx="660" cy="200" r="5" fill="#7B5CFC"/>
    <circle cx="660" cy="200" r="9" fill="none" stroke="#7B5CFC" stroke-width="0.8"/>
    <circle cx="1040" cy="200" r="5" fill="#A78BFA"/>
    <circle cx="1040" cy="200" r="9" fill="none" stroke="#A78BFA" stroke-width="0.8"/>
    <circle cx="660" cy="430" r="5" fill="#A78BFA"/>
    <circle cx="660" cy="430" r="9" fill="none" stroke="#A78BFA" stroke-width="0.8"/>
    <circle cx="1040" cy="430" r="5" fill="#7B5CFC"/>
    <circle cx="1040" cy="430" r="9" fill="none" stroke="#7B5CFC" stroke-width="0.8"/>
  </g>

  <!-- ==================== TEXT ZONE ==================== -->
  <!-- Brand badge -->
  <rect x="60" y="90" width="110" height="34" rx="17" fill="#7B5CFC" opacity="0.15"/>
  <rect x="60" y="90" width="110" height="34" rx="17" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
  <text x="115" y="112" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#C4B5FD" text-anchor="middle" letter-spacing="3">
    StudeQ
  </text>

  <!-- Main headline -->
  <text x="60" y="205" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="-0.5">
    Privacy Policy
  </text>

  <!-- Sub-headline -->
  <text x="60" y="265" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="500" font-size="24" fill="#A78BFA" letter-spacing="0.3">
    Your Data, Your Trust
  </text>

  <!-- Divider line -->
  <line x1="60" y1="295" x2="420" y2="295" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- Key points -->
  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="500" font-size="18" fill="#8B8BA8" letter-spacing="0.3">
    <text x="60" y="345">• Transparent data collection</text>
    <text x="60" y="380">• Cookie usage &amp; control</text>
    <text x="60" y="415">• Third-party sharing policy</text>
    <text x="60" y="450">• Your rights &amp; choices</text>
  </g>

  <!-- Bottom tagline -->
  <text x="60" y="530" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="500" font-size="16" fill="#6B6B8A" letter-spacing="2">
    ENCRYPTED · SECURE · TRANSPARENT
  </text>

  <!-- URL -->
  <text x="60" y="575" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="400" font-size="15" fill="#5B5B7A" letter-spacing="1">
    studeq.com/privacy-policy
  </text>

  <!-- Right-side badge pills -->
  <g opacity="0.55">
    <rect x="710" y="540" width="140" height="38" rx="19" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
    <text x="780" y="564" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle" letter-spacing="2">
      SSL 256-BIT
    </text>
  </g>
  <g opacity="0.55">
    <rect x="865" y="540" width="140" height="38" rx="19" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
    <text x="935" y="564" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle" letter-spacing="2">
      GDPR READY
    </text>
  </g>
  <g opacity="0.55">
    <rect x="1020" y="540" width="130" height="38" rx="19" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
    <text x="1085" y="564" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle" letter-spacing="2">
      ZERO LEAK
    </text>
  </g>

  <!-- Bottom accent line -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="url(#accentLine)" stroke-width="1.5"/>
</svg>