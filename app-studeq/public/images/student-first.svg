<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad1)" stroke="#4f46e5" stroke-width="2" opacity="0.3"/>
  
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15"/>

  <!-- Desk surface -->
  <g filter="url(#shadow1)">
    <rect x="100" y="240" width="200" height="15" rx="3" fill="url(#deskGrad)"/>
    <rect x="110" y="255" width="180" height="30" rx="2" fill="#4338ca" opacity="0.5"/>
    <!-- Desk legs -->
    <rect x="120" y="285" width="8" height="50" rx="2" fill="#312e81" opacity="0.4"/>
    <rect x="272" y="285" width="8" height="50" rx="2" fill="#312e81" opacity="0.4"/>
  </g>

  <!-- Person at desk -->
  <g transform="translate(200, 180)">
    <!-- Body -->
    <rect x="-25" y="10" width="50" height="55" rx="8" fill="#1e293b" opacity="0.9"/>
    
    <!-- Arms - typing/working -->
    <path d="M-25,25 Q-45,35 -50,50 Q-48,55 -42,52 Q-38,45 -25,35" fill="#1e293b" opacity="0.85"/>
    <path d="M25,25 Q45,35 50,50 Q48,55 42,52 Q38,45 25,35" fill="#1e293b" opacity="0.85"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-2" rx="22" ry="24" fill="#1e293b" opacity="0.9"/>
    
    <!-- Face - focused expression -->
    <ellipse cx="-7" cy="-2" rx="3" ry="3.5" fill="#94a3b8" opacity="0.6"/>
    <ellipse cx="7" cy="-2" rx="3" ry="3.5" fill="#94a3b8" opacity="0.6"/>
    <path d="M-3,6 Q0,9 3,6" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Hair -->
    <path d="M-20,-2 Q-22,-12 -15,-18 Q-8,-22 0,-24 Q8,-22 15,-18 Q22,-12 22,-2" fill="#0f172a" opacity="0.9"/>
    
    <!-- Focused lighting on person -->
    <ellipse cx="0" cy="-5" rx="35" ry="30" fill="url(#lightGrad)" opacity="0.3"/>
  </g>

  <!-- Laptop/device on desk -->
  <g transform="translate(200, 230)" filter="url(#shadow1)">
    <rect x="-30" y="-18" width="60" height="40" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Screen glow -->
    <rect x="-26" y="-14" width="52" height="32" rx="2" fill="url(#accentGrad1)" opacity="0.6"/>
    <!-- Screen content -->
    <line x1="-18" y1="-6" x2="12" y2="-6" stroke="#fff" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="-18" y1="6" x2="14" y2="6" stroke="#fff" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Notes/books -->
  <g transform="translate(150, 238)" opacity="0.7">
    <rect x="0" y="0" width="25" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" transform="rotate(-8)"/>
    <rect x="0" y="0" width="25" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" transform="rotate(5) translate(3, -2)"/>
  </g>

  <!-- Coffee mug -->
  <g transform="translate(260, 238)" opacity="0.6">
    <rect x="-8" y="-12" width="16" height="18" rx="3" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <path d="M8,-8 Q14,-8 14,-4 Q14,0 8,0" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-12" rx="8" ry="3" fill="#1e293b"/>
  </g>

  <!-- Sparkle/focus icon top right -->
  <g transform="translate(310, 80)" filter="url(#glow1)" opacity="0.5">
    <path d="M0,0 L5,-12 L10,0 L22,5 L10,10 L5,22 L0,10 L-12,5 Z" fill="#fcd34d"/>
  </g>

  <!-- Small dots circling -->
  <circle cx="120" cy="120" r="3" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="280" cy="120" r="3" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="100" cy="260" r="2" fill="#6366f1" opacity="0.2"/>
  <circle cx="300" cy="260" r="2" fill="#6366f1" opacity="0.2"/>
</svg>