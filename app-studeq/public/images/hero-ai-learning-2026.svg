<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3f3d9e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#4a47d1"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#8b83ff"/>
      <stop offset="100%" stop-color="#b8b2ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Floating glow orbs -->
  <circle cx="900" cy="120" r="200" fill="url(#glowGrad)" filter="url(#softGlow)"/>
  <circle cx="150" cy="500" r="150" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.5"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Hero Icon: AI Brain + Learning Nodes -->
  <g transform="translate(760, 315)" filter="url(#glow)">
    <!-- Brain outline -->
    <path d="M-80,-60 C-80,-90 -40,-100 -20,-80 C-10,-95 10,-95 20,-80 C40,-100 80,-90 80,-60 C90,-40 85,-10 70,0 C85,10 90,40 80,60 C80,90 40,100 20,80 C10,95 -10,95 -20,80 C-40,100 -80,90 -80,60 C-90,40 -85,10 -70,0 C-85,-10 -90,-40 -80,-60 Z"
          fill="none" stroke="url(#brainGrad)" stroke-width="3" opacity="0.8"/>
    <!-- Brain fissures -->
    <path d="M-50,-30 C-30,-40 -10,-20 10,-30 C30,-40 50,-20" stroke="url(#brainGrad)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-40,0 C-20,-10 0,10 20,0 C40,-10 50,10" stroke="url(#brainGrad)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-30,30 C-10,20 10,40 30,30" stroke="url(#brainGrad)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-60,0 C-50,15 -40,-15 -30,0" stroke="url(#brainGrad)" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M30,0 C40,15 50,-15 60,0" stroke="url(#brainGrad)" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- AI connection nodes -->
    <circle cx="-90" cy="-70" r="6" fill="#6c63ff" opacity="0.9"/>
    <circle cx="-100" cy="-40" r="4" fill="#8b83ff" opacity="0.7"/>
    <circle cx="-95" cy="-10" r="5" fill="#6c63ff" opacity="0.8"/>
    <circle cx="90" cy="-70" r="6" fill="#6c63ff" opacity="0.9"/>
    <circle cx="100" cy="-40" r="4" fill="#8b83ff" opacity="0.7"/>
    <circle cx="95" cy="-10" r="5" fill="#6c63ff" opacity="0.8"/>

    <!-- Connection lines -->
    <line x1="-90" y1="-70" x2="-60" y2="-50" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="-100" y1="-40" x2="-55" y2="-25" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="-95" y1="-10" x2="-50" y2="-10" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="90" y1="-70" x2="60" y2="-50" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="-40" x2="55" y2="-25" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="95" y1="-10" x2="50" y2="-10" stroke="#6c63ff" stroke-width="1.5" opacity="0.4"/>

    <!-- Sparkle particles -->
    <circle cx="-70" cy="-80" r="2" fill="#b8b2ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="-80" r="2" fill="#b8b2ff" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-95" r="2.5" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-85" cy="40" r="2" fill="#b8b2ff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="40" r="2" fill="#b8b2ff" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating data nodes -->
    <circle cx="-50" cy="70" r="3" fill="#6c63ff" opacity="0.6">
      <animate attributeName="cy" values="70;65;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="70" r="3" fill="#6c63ff" opacity="0.6">
      <animate attributeName="cy" values="70;65;70" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="0" cy="75" r="2.5" fill="#8b83ff" opacity="0.5">
      <animate attributeName="cy" values="75;68;75" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Main text: "AI-POWERED LEARNING" -->
  <g transform="translate(60, 200)">
    <!-- Accent bar -->
    <rect x="0" y="0" width="8" height="120" rx="4" fill="url(#accentGrad)" filter="url(#glow)"/>

    <!-- Main headline -->
    <text x="40" y="45" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#textGrad)" letter-spacing="2">
      AI-POWERED
    </text>
    <text x="40" y="115" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="62" font-weight="900" fill="url(#textGrad)" letter-spacing="2">
      LEARNING
    </text>

    <!-- Subtitle -->
    <text x="42" y="170" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#a8a8d0" letter-spacing="0.5" opacity="0.9">
      Smarter study tools for tomorrow's minds
    </text>

    <!-- Small stat/credibility -->
    <rect x="42" y="195" width="140" height="32" rx="16" fill="#6c63ff" opacity="0.15"/>
    <text x="112" y="216" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8b83ff" text-anchor="middle" letter-spacing="0.5">
      ⚡ 2026 EDITION
    </text>
  </g>

  <!-- Bottom decorative accent -->
  <rect x="60" y="590" width="200" height="4" rx="2" fill="url(#accentGrad)" opacity="0.5"/>
  <rect x="270" y="590" width="80" height="4" rx="2" fill="#6c63ff" opacity="0.2"/>
</svg>