  </defs>

  <!-- Cookie body (circle with bite) -->
  <path d="M16 3C9.925 3 5 7.925 5 14C5 20.075 9.925 25 16 25C19.5 25 22.6 23.2 24.5 20.5C23.8 20.8 23 21 22.2 21C19.4 21 17.2 18.8 17.2 16C17.2 13.2 19.4 11 22.2 11C23 11 23.8 11.2 24.5 11.5C24.8 9.2 24.5 6.8 23.5 4.8C22 3.7 19.2 3 16 3Z"
        fill="url(#cookieGrad)" stroke="#7B5CFC" stroke-width="0.8"/>

  <!-- Cookie bite mark (darker inner edge) -->
  <path d="M22.5 12C20.2 12 18.5 13.7 18.5 16C18.5 18.3 20.2 20 22.5 20"
        fill="none" stroke="#4F3CF5" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Highlight/shine -->
  <path d="M16 3C9.925 3 5 7.925 5 14C5 20.075 9.925 25 16 25C19.5 25 22.6 23.2 24.5 20.5C23.8 20.8 23 21 22.2 21C19.4 21 17.2 18.8 17.2 16C17.2 13.2 19.4 11 22.2 11C23 11 23.8 11.2 24.5 11.5C24.8 9.2 24.5 6.8 23.5 4.8C22 3.7 19.2 3 16 3Z"
