  <!-- Chocolate chips -->
  <circle cx="11" cy="13" r="2.2" fill="url(#chipGrad)" opacity="0.85"/>
  <circle cx="10" cy="12.5" r="0.8" fill="#FFFFFF" opacity="0.15"/>

  <circle cx="17" cy="9" r="1.8" fill="url(#chipGrad)" opacity="0.85"/>
  <circle cx="16.5" cy="8.6" r="0.6" fill="#FFFFFF" opacity="0.15"/>

  <circle cx="14" cy="19" r="2" fill="url(#chipGrad)" opacity="0.85"/>
  <circle cx="13.3" cy="18.5" r="0.7" fill="#FFFFFF" opacity="0.15"/>

  <circle cx="9" cy="17.5" r="1.5" fill="url(#chipGrad)" opacity="0.7"/>

  <circle cx="19" cy="16.5" r="1.6" fill="url(#chipGrad)" opacity="0.7"/>
