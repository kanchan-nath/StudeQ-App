<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="mailGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7B5CFC"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6B4FDF"/>
    </linearGradient>
  </defs>

  <!-- Envelope body -->
  <rect x="4" y="9" width="24" height="17" rx="2.5" fill="url(#mailGrad)" stroke="#4F3CF5" stroke-width="0.7"/>

  <!-- Envelope flap -->
  <path d="M4 11.5L16 20L28 11.5"
        fill="none" stroke="url(#flapGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flap inner fill -->
  <path d="M4 11.5L16 20L28 11.5L16 16L4 11.5Z"
        fill="url(#flapGrad)" opacity="0.4"/>

  <!-- Security shield dot on envelope -->
  <circle cx="22" cy="20" r="4" fill="#4F3CF5" stroke="#A78BFA" stroke-width="0.8"/>
  <polyline points="20.5,20 21.8,21.5 23.8,18.8" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Envelope highlight -->
  <rect x="6" y="22" width="12" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.15"/>
</svg>