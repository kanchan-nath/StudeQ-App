<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glassShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad2)" stroke="#60a5fa" stroke-width="2" opacity="0.2"/>
  
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.08"/>

  <!-- Light beams passing through -->
  <g opacity="0.15">
    <polygon points="200,80 150,320 250,320" fill="url(#lightBeam)"/>
    <polygon points="200,80 120,300 180,300" fill="url(#lightBeam)" opacity="0.5"/>
    <polygon points="200,80 220,300 280,300" fill="url(#lightBeam)" opacity="0.5"/>
  </g>

  <!-- Glass window frame -->
  <g filter="url(#glassShadow)" transform="translate(200, 195)">
    <!-- Outer frame -->
    <rect x="-85" y="-85" width="170" height="170" rx="12" fill="none" stroke="#475569" stroke-width="4"/>
    
    <!-- Glass pane -->
    <rect x="-75" y="-75" width="150" height="150" rx="8" fill="url(#glassGrad)" stroke="url(#glassEdge)" stroke-width="2"/>
    
    <!-- Cross frame dividers -->
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#475569" stroke-width="3"/>
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#475569" stroke-width="3"/>
    
    <!-- Glass reflection/shine -->
    <ellipse cx="-30" cy="-40" rx="25" ry="15" fill="#fff" opacity="0.08" transform="rotate(-30, -30, -40)"/>
    <ellipse cx="35" cy="40" rx="20" ry="12" fill="#fff" opacity="0.05" transform="rotate(-30, 35, 40)"/>
    
    <!-- Inner glow on glass -->
    <rect x="-65" y="-65" width="130" height="130" rx="6" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.2" filter="url(#innerGlow)"/>
  </g>

  <!-- Data/algorithm symbols floating around -->
  <g opacity="0.4">
    <!-- Code brackets -->
    <text x="100" y="130" font-family="'Courier New', monospace" font-size="20" fill="#60a5fa" opacity="0.4">&lt;/&gt;</text>
    <text x="275" y="280" font-family="'Courier New', monospace" font-size="20" fill="#8b5cf6" opacity="0.4">[]</text>
    
    <!-- Small data nodes -->
    <circle cx="130" cy="280" r="4" fill="#60a5fa" opacity="0.3"/>
    <circle cx="280" cy="120" r="4" fill="#8b5cf6" opacity="0.3"/>
    
    <!-- Connection lines -->
    <line x1="130" y1="280" x2="200" y2="280" stroke="#60a5fa" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
    <line x1="280" y1="120" x2="200" y2="120" stroke="#8b5cf6" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
    
    <!-- Lock icon - privacy -->
    <g transform="translate(290, 280)" opacity="0.3">
      <rect x="-6" y="-4" width="12" height="10" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <path d="M-3,-4 L-3,-7 Q-3,-10 0,-10 Q3,-10 3,-7 L3,-4" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#60a5fa" opacity="0.4"/>
    </g>
  </g>

  <!-- Eye/sight icon - transparency -->
  <g transform="translate(200, 330)" opacity="0.3" filter="url(#glow2)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#60a5fa" opacity="0.4"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(120, 110)" opacity="0.4">
    <path d="M0,0 L3,-8 L6,0 L14,3 L6,6 L3,14 L0,6 L-8,3 Z" fill="#fcd34d"/>
  </g>

  <!-- Bottom dots -->
  <circle cx="160" cy="350" r="2" fill="#6366f1" opacity="0.2"/>
  <circle cx="240" cy="350" r="2" fill="#6366f1" opacity="0.2"/>
</svg>