<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="personGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="softShadow3">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad3)" stroke="#8b5cf6" stroke-width="2" opacity="0.2"/>
  
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.08"/>

  <!-- Shared canvas/whiteboard -->
  <g filter="url(#shadow3)" transform="translate(200, 190)">
    <rect x="-80" y="-70" width="160" height="140" rx="8" fill="url(#canvasGrad)" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Canvas content - collaborative sketches -->
    <!-- Flowchart -->
    <g stroke="#1e293b" stroke-width="1.5" fill="none" opacity="0.5">
      <rect x="-55" y="-45" width="40" height="25" rx="3"/>
      <rect x="-5" y="-45" width="40" height="25" rx="3"/>
      <rect x="-30" y="-10" width="40" height="25" rx="3"/>
      <line x1="-35" y1="-32" x2="-5" y2="-32"/>
      <line x1="15" y1="-32" x2="-10" y2="-10"/>
      <line x1="-55" y1="-32" x2="-30" y2="-10"/>
      
      <!-- Small scribbles -->
      <line x1="-48" y1="-38" x2="-22" y2="-38" stroke-width="1"/>
      <line x1="-48" y1="-34" x2="-30" y2="-34" stroke-width="1"/>
      <line x1="2" y1="-38" x2="28" y2="-38" stroke-width="1"/>
    </g>

    <!-- Graph/chart -->
    <g stroke="#1e293b" stroke-width="1.5" fill="none" opacity="0.4">
      <polyline points="-50,20 -30,5 -10,15 10,-5 30,10 45,0"/>
      <circle cx="-50" cy="20" r="2.5" fill="#1e293b"/>
      <circle cx="-30" cy="5" r="2.5" fill="#1e293b"/>
      <circle cx="-10" cy="15" r="2.5" fill="#1e293b"/>
      <circle cx="10" cy="-5" r="2.5" fill="#1e293b"/>
      <circle cx="30" cy="10" r="2.5" fill="#1e293b"/>
      <circle cx="45" cy="0" r="2.5" fill="#1e293b"/>
    </g>

    <!-- Sticky notes -->
    <g transform="translate(-70, 30) rotate(-5)">
      <rect width="30" height="25" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" opacity="0.7"/>
      <line x1="4" y1="6" x2="26" y2="6" stroke="#854d0e" stroke-width="0.8" opacity="0.4"/>
      <line x1="4" y1="11" x2="22" y2="11" stroke="#854d0e" stroke-width="0.8" opacity="0.4"/>
    </g>
    <g transform="translate(40, 25) rotate(8)">
      <rect width="30" height="25" rx="1" fill="#a7f3d0" stroke="#059669" stroke-width="0.8" opacity="0.7"/>
      <line x1="4" y1="6" x2="26" y2="6" stroke="#064e3b" stroke-width="0.8" opacity="0.4"/>
      <line x1="4" y1="11" x2="20" y2="11" stroke="#064e3b" stroke-width="0.8" opacity="0.4"/>
    </g>

    <!-- Idea sparkle -->
    <g transform="translate(50, -55)" filter="url(#glow3)" opacity="0.5">
      <path d="M0,0 L4,-10 L8,0 L18,4 L8,8 L4,18 L0,8 L-10,4 Z" fill="#8b5cf6"/>
    </g>
  </g>

  <!-- Person 1 - left side -->
  <g transform="translate(120, 300)" filter="url(#softShadow3)">
    <!-- Body -->
    <rect x="-15" y="5" width="30" height="35" rx="6" fill="url(#personGrad)" opacity="0.85"/>
    <!-- Arm pointing to canvas -->
    <path d="M15,15 Q35,10 45,5 Q47,3 44,2 Q40,4 30,10" fill="url(#personGrad)" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="0" cy="-2" rx="14" ry="15" fill="#312e81" opacity="0.85"/>
    <!-- Face -->
    <ellipse cx="-4" cy="-3" rx="2" ry="2.5" fill="#94a3b8" opacity="0.4"/>
    <ellipse cx="4" cy="-3" rx="2" ry="2.5" fill="#94a3b8" opacity="0.4"/>
    <path d="M-2,2 Q0,4 2,2" stroke="#94a3b8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Person 2 - right side -->
  <g transform="translate(280, 300)" filter="url(#softShadow3)">
    <!-- Body -->
    <rect x="-15" y="5" width="30" height="35" rx="6" fill="url(#personGrad2)" opacity="0.85"/>
    <!-- Arm pointing to canvas -->
    <path d="M-15,15 Q-35,10 -45,5 Q-47,3 -44,2 Q-40,4 -30,10" fill="url(#personGrad2)" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="0" cy="-2" rx="14" ry="15" fill="#4c1d95" opacity="0.85"/>
    <!-- Face -->
    <ellipse cx="-4" cy="-3" rx="2" ry="2.5" fill="#94a3b8" opacity="0.4"/>
    <ellipse cx="4" cy="-3" rx="2" ry="2.5" fill="#94a3b8" opacity="0.4"/>
    <path d="M-2,2 Q0,4 2,2" stroke="#94a3b8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Connection paths - collaboration -->
  <g opacity="0.15">
    <path d="M135,295 Q170,250 200,250 Q230,250 265,295" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M130,310 Q200,270 270,310" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Feedback/update symbols -->
  <g opacity="0.3">
    <!-- Refresh/update arrows -->
    <path d="M80,110 Q90,95 105,95 Q120,95 130,110" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <polygon points="130,110 125,105 125,115" fill="#8b5cf6"/>
    <path d="M320,110 Q310,95 295,95 Q280,95 270,110" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <polygon points="270,110 275,105 275,115" fill="#8b5cf6"/>
    
    <!-- Small stars -->
    <text x="90" y="90" font-size="12" fill="#fcd34d">✦</text>
    <text x="310" y="90" font-size="12" fill="#fcd34d">✦</text>
  </g>

  <!-- Bottom dots -->
  <circle cx="180" cy="355" r="2" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="220" cy="355" r="2" fill="#6366f1" opacity="0.2"/>
</svg>