<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="40%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#1a2e3a"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#2a3a5a"/>
    </linearGradient>
    <linearGradient id="treeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
    <linearGradient id="treeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5a3a"/>
      <stop offset="100%" style="stop-color:#1a3a2a"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5a3a"/>
      <stop offset="100%" style="stop-color:#1a3a2a"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="leafShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Sky gradient overlay -->
  <rect width="1200" height="450" fill="url(#skyGrad)" opacity="0.5"/>

  <!-- Sun glow -->
  <circle cx="900" cy="150" r="200" fill="url(#sunGrad)"/>
  <circle cx="900" cy="150" r="80" fill="#fcd34d" opacity="0.15"/>

  <!-- Soft clouds -->
  <g opacity="0.08">
    <ellipse cx="200" cy="120" rx="120" ry="30" fill="#94a3b8"/>
    <ellipse cx="250" cy="110" rx="80" ry="25" fill="#94a3b8"/>
    <ellipse cx="700" cy="80" rx="100" ry="25" fill="#94a3b8"/>
    <ellipse cx="750" cy="70" rx="70" ry="20" fill="#94a3b8"/>
  </g>

  <!-- Distant trees silhouette -->
  <g opacity="0.15">
    <path d="M0,450 Q50,380 100,450 Q130,400 180,450 Q210,410 260,450 Q290,390 340,450 Q370,420 420,450 L420,500 L0,500 Z" fill="#1a3a2a"/>
    <path d="M800,450 Q850,370 900,450 Q930,390 980,450 Q1010,410 1060,450 Q1090,380 1140,450 Q1170,400 1200,450 L1200,500 L800,500 Z" fill="#1a3a2a"/>
  </g>

  <!-- Ground / grass -->
  <ellipse cx="600" cy="720" rx="650" ry="200" fill="url(#grassGrad)"/>
  <rect x="0" y="600" width="1200" height="300" fill="url(#grassGrad)" opacity="0.8"/>

  <!-- Grass texture lines -->
  <g stroke="#4a7a5a" stroke-width="1.5" opacity="0.2">
    <line x1="50" y1="650" x2="45" y2="630"/>
    <line x1="80" y1="660" x2="75" y2="640"/>
    <line x1="120" y1="680" x2="115" y2="660"/>
    <line x1="200" y1="700" x2="195" y2="680"/>
    <line x1="350" y1="670" x2="345" y2="650"/>
    <line x1="500" y1="690" x2="495" y2="670"/>
    <line x1="650" y1="680" x2="645" y2="660"/>
    <line x1="750" y1="700" x2="745" y2="680"/>
    <line x1="850" y1="660" x2="845" y2="640"/>
    <line x1="920" y1="690" x2="915" y2="670"/>
    <line x1="1000" y1="710" x2="995" y2="690"/>
    <line x1="1050" y1="670" x2="1045" y2="650"/>
    <line x1="1100" y1="650" x2="1095" y2="630"/>
  </g>

  <!-- Tree trunk -->
  <g filter="url(#softShadow)">
    <path d="M320,550 Q310,500 300,450 Q295,420 290,390 L310,385 Q315,415 320,450 Q325,500 330,550 Z" fill="#3d2817"/>
    <path d="M310,500 Q280,480 260,460 Q250,450 255,440 Q265,445 280,455 Q295,465 310,480 Z" fill="#3d2817"/>
    <path d="M315,470 Q340,450 355,440 Q365,435 360,425 Q350,430 335,440 Q320,450 310,460 Z" fill="#3d2817"/>
    <!-- Trunk texture -->
    <path d="M305,420 Q310,430 315,420" stroke="#2d1807" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M308,450 Q312,460 316,450" stroke="#2d1807" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M300,480 Q305,490 310,480" stroke="#2d1807" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Tree foliage - back layer -->
  <g filter="url(#leafShadow)">
    <ellipse cx="280" cy="340" rx="100" ry="80" fill="url(#treeGrad1)" opacity="0.9"/>
    <ellipse cx="340" cy="320" rx="90" ry="75" fill="url(#treeGrad2)" opacity="0.9"/>
    <ellipse cx="230" cy="360" rx="70" ry="60" fill="url(#treeGrad1)" opacity="0.85"/>
    <ellipse cx="370" cy="360" rx="65" ry="55" fill="url(#treeGrad2)" opacity="0.85"/>
  </g>

  <!-- Tree foliage - front layer -->
  <g filter="url(#leafShadow)">
    <ellipse cx="260" cy="370" rx="80" ry="65" fill="#2a5a3a" opacity="0.8"/>
    <ellipse cx="320" cy="350" rx="75" ry="60" fill="#3a6a4a" opacity="0.8"/>
    <ellipse cx="350" cy="380" rx="60" ry="50" fill="#2a5a3a" opacity="0.75"/>
    <ellipse cx="210" cy="390" rx="55" ry="45" fill="#1a4a2a" opacity="0.7"/>
  </g>

  <!-- Leaf highlights -->
  <g fill="#4a8a5a" opacity="0.3">
    <ellipse cx="270" cy="330" rx="25" ry="15"/>
    <ellipse cx="330" cy="315" rx="20" ry="12"/>
    <ellipse cx="240" cy="350" rx="15" ry="10"/>
  </g>

  <!-- Student sitting under tree -->
  <g transform="translate(340, 540)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="45" ry="35" fill="#1e293b" opacity="0.9"/>
    
    <!-- Legs extended comfortably -->
    <path d="M-20,80 Q-40,100 -60,110 Q-70,115 -65,120 Q-55,115 -40,105 Q-20,90 -10,80 Z" fill="#334155"/>
    <path d="M10,80 Q30,100 50,110 Q60,115 55,120 Q45,115 30,105 Q15,90 5,80 Z" fill="#334155"/>
    
    <!-- Shoes -->
    <ellipse cx="-65" cy="122" rx="12" ry="6" fill="#475569"/>
    <ellipse cx="55" cy="122" rx="12" ry="6" fill="#475569"/>

    <!-- Torso - leaning against tree -->
    <path d="M-30,25 Q-35,50 -25,70 Q0,80 25,70 Q35,50 30,25 Z" fill="#3b82f6" opacity="0.85"/>
    
    <!-- Arms holding tablet -->
    <path d="M-25,40 Q-45,55 -40,65 Q-35,60 -20,50" fill="#1e293b" opacity="0.9"/>
    <path d="M25,40 Q45,55 40,65 Q35,60 20,50" fill="#1e293b" opacity="0.9"/>

    <!-- Tablet -->
    <g transform="translate(-8, 45) rotate(-12)">
      <rect x="-35" y="-25" width="70" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
      <!-- Screen glow -->
      <rect x="-30" y="-20" width="60" height="40" rx="3" fill="url(#tabletGrad)" opacity="0.8"/>
      <!-- Screen content - lines of text -->
      <line x1="-20" y1="-12" x2="15" y2="-12" stroke="#fff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
      <line x1="-20" y1="-4" x2="25" y2="-4" stroke="#fff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
      <line x1="-20" y1="4" x2="20" y2="4" stroke="#fff" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <line x1="-20" y1="12" x2="10" y2="12" stroke="#fff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
      <!-- Screen icon -->
      <circle cx="20" cy="8" r="6" fill="#fcd34d" opacity="0.4"/>
    </g>

    <!-- Head -->
    <ellipse cx="0" cy="10" rx="28" ry="30" fill="#1e293b" opacity="0.9"/>
    
    <!-- Calm face -->
    <!-- Eyes - closed/happy squint -->
    <path d="M-12,6 Q-8,3 -4,6" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M4,6 Q8,3 12,6" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Calm smile -->
    <path d="M-6,14 Q0,18 6,14" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Hair -->
    <path d="M-25,5 Q-28,-5 -22,-12 Q-15,-18 -5,-20 Q5,-22 15,-18 Q22,-12 25,-5 Q28,0 28,8" fill="#0f172a" opacity="0.9"/>
    <path d="M-20,-10 Q-15,-15 -8,-18 Q0,-20 8,-18 Q15,-15 18,-10" fill="#1e293b" opacity="0.7"/>

    <!-- Notebook on lap -->
    <g transform="translate(-30, 75) rotate(8)">
      <rect x="0" y="0" width="55" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="8" y1="10" x2="47" y2="10" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="16" x2="40" y2="16" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="22" x2="43" y2="22" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
      <!-- Pen -->
      <line x1="50" y1="5" x2="58" y2="-2" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Small flowers in grass -->
  <g opacity="0.6">
    <circle cx="180" cy="670" r="3" fill="#f472b6"/>
    <circle cx="185" cy="668" r="3" fill="#f472b6"/>
    <circle cx="182" cy="672" r="3" fill="#f472b6"/>
    <circle cx="182" cy="670" r="2" fill="#fbbf24"/>
    
    <circle cx="520" cy="710" r="3" fill="#f472b6"/>
    <circle cx="525" cy="708" r="3" fill="#f472b6"/>
    <circle cx="522" cy="712" r="3" fill="#f472b6"/>
    <circle cx="522" cy="710" r="2" fill="#fbbf24"/>
    
    <circle cx="700" cy="680" r="3" fill="#60a5fa"/>
    <circle cx="705" cy="678" r="3" fill="#60a5fa"/>
    <circle cx="702" cy="682" r="3" fill="#60a5fa"/>
    <circle cx="702" cy="680" r="2" fill="#fbbf24"/>
  </g>

  <!-- Floating leaves -->
  <g opacity="0.3">
    <path d="M150,400 Q155,390 160,400 Q155,405 150,400 Z" fill="#4a8a5a" transform="rotate(20, 155, 400)"/>
    <path d="M450,380 Q455,370 460,380 Q455,385 450,380 Z" fill="#4a8a5a" transform="rotate(-15, 455, 380)"/>
    <path d="M120,450 Q125,440 130,450 Q125,455 120,450 Z" fill="#4a8a5a" transform="rotate(35, 125, 450)"/>
  </g>

  <!-- Keyword text - F-pattern top-left -->
  <text x="60" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="60" font-weight="900" fill="#fff" letter-spacing="1.5">
    FOCUSED <tspan fill="#8b5cf6">LEARNING</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a5b4fc" letter-spacing="2">
    PEACE · PRESENCE · PROGRESS
  </text>

  <!-- Accent line -->
  <rect x="60" y="185" width="100" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Tagline bottom right -->
  <text x="1140" y="860" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#64748b" text-anchor="end" letter-spacing="3">
    STUDY · REST · GROW
  </text>

  <!-- Decorative corner -->
  <rect x="30" y="830" width="60" height="3" rx="1.5" fill="#3b82f6" opacity="0.3"/>
  <rect x="1110" y="30" width="60" height="3" rx="1.5" fill="#3b82f6" opacity="0.3"/>
</svg>