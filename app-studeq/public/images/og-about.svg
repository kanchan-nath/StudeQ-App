<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="40%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="bgAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Brand gradients -->
    <linearGradient id="brandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Element gradients -->
    <linearGradient id="whiteboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="person1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="person2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="person3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgMain)"/>
  
  <!-- Subtle background pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="150" cy="500" r="300" fill="url(#glowGrad)"/>
  <circle cx="1050" cy="150" r="250" fill="url(#glowGrad)" opacity="0.5"/>
  <circle cx="600" cy="315" r="400" fill="url(#glowGrad)" opacity="0.15"/>

  <!-- Hero illustration - Team collaboration scene -->
  <g transform="translate(100, 80)">
    <!-- Large whiteboard - 55% of canvas -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="580" height="440" rx="14" fill="url(#whiteboardGrad)" stroke="#818cf8" stroke-width="3"/>
      <rect x="-6" y="-6" width="592" height="452" rx="18" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
      
      <!-- Whiteboard content -->
      <!-- Brainstorming circle diagram -->
      <g stroke="#1e293b" stroke-width="2.5" fill="none" opacity="0.6">
        <circle cx="180" cy="180" r="65"/>
        <circle cx="180" cy="180" r="35"/>
        <line x1="180" y1="115" x2="180" y2="245"/>
        <line x1="115" y1="180" x2="245" y2="180"/>
        <line x1="134" y1="134" x2="226" y2="226"/>
        <line x1="134" y1="226" x2="226" y2="134"/>
        
        <!-- Nodes -->
        <circle cx="180" cy="115" r="5" fill="#1e293b"/>
        <circle cx="180" cy="245" r="5" fill="#1e293b"/>
        <circle cx="115" cy="180" r="5" fill="#1e293b"/>
        <circle cx="245" cy="180" r="5" fill="#1e293b"/>
        <circle cx="134" cy="134" r="5" fill="#1e293b"/>
        <circle cx="226" cy="226" r="5" fill="#1e293b"/>
        <circle cx="134" cy="226" r="5" fill="#1e293b"/>
        <circle cx="226" cy="134" r="5" fill="#1e293b"/>
      </g>

      <!-- Flowchart diagram -->
      <g stroke="#1e293b" stroke-width="2" fill="none" opacity="0.45">
        <rect x="320" y="110" width="75" height="40" rx="4"/>
        <rect x="420" y="110" width="75" height="40" rx="4"/>
        <rect x="370" y="180" width="75" height="40" rx="4"/>
        <rect x="320" y="250" width="75" height="40" rx="4"/>
        <rect x="420" y="250" width="75" height="40" rx="4"/>
        
        <line x1="395" y1="150" x2="395" y2="180"/>
        <line x1="457" y1="130" x2="412" y2="200"/>
        <line x1="337" y1="130" x2="370" y2="200"/>
        <line x1="357" y1="220" x2="357" y2="250"/>
        <line x1="457" y1="220" x2="457" y2="250"/>
        
        <!-- Small text scribbles -->
        <line x1="328" y1="122" x2="387" y2="122" stroke-width="1.2"/>
        <line x1="328" y1="130" x2="370" y2="130" stroke-width="1.2"/>
        <line x1="428" y1="122" x2="487" y2="122" stroke-width="1.2"/>
        <line x1="378" y1="192" x2="437" y2="192" stroke-width="1.2"/>
      </g>

      <!-- Data chart -->
      <g stroke="#1e293b" stroke-width="2" fill="none" opacity="0.4">
        <polyline points="100,340 160,290 220,310 280,250 340,280 400,220 460,250"/>
        <circle cx="100" cy="340" r="3.5" fill="#1e293b"/>
        <circle cx="160" cy="290" r="3.5" fill="#1e293b"/>
        <circle cx="220" cy="310" r="3.5" fill="#1e293b"/>
        <circle cx="280" cy="250" r="3.5" fill="#1e293b"/>
        <circle cx="340" cy="280" r="3.5" fill="#1e293b"/>
        <circle cx="400" cy="220" r="3.5" fill="#1e293b"/>
        <circle cx="460" cy="250" r="3.5" fill="#1e293b"/>
      </g>

      <!-- Sticky notes -->
      <g transform="translate(490, 280) rotate(-6)">
        <rect width="70" height="60" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1" opacity="0.75"/>
        <line x1="8" y1="14" x2="62" y2="14" stroke="#854d0e" stroke-width="1.5" opacity="0.4"/>
        <line x1="8" y1="24" x2="55" y2="24" stroke="#854d0e" stroke-width="1.5" opacity="0.4"/>
        <line x1="8" y1="34" x2="58" y2="34" stroke="#854d0e" stroke-width="1.5" opacity="0.4"/>
        <circle cx="35" cy="4" r="3.5" fill="#ef4444"/>
      </g>
      
      <g transform="translate(20, 290) rotate(5)">
        <rect width="65" height="55" rx="2" fill="#a7f3d0" stroke="#059669" stroke-width="1" opacity="0.75"/>
        <line x1="8" y1="13" x2="57" y2="13" stroke="#064e3b" stroke-width="1.5" opacity="0.4"/>
        <line x1="8" y1="23" x2="50" y2="23" stroke="#064e3b" stroke-width="1.5" opacity="0.4"/>
      </g>

      <!-- Idea sparkle -->
      <g transform="translate(310, 70)" filter="url(#lightGlow)">
        <path d="M0,0 L7,-18 L14,0 L32,7 L14,14 L7,32 L0,14 L-18,7 Z" fill="#8b5cf6" opacity="0.5"/>
      </g>
      
      <!-- Small sparkle dots -->
      <circle cx="280" cy="85" r="2" fill="#8b5cf6" opacity="0.3"/>
      <circle cx="340" cy="95" r="2" fill="#8b5cf6" opacity="0.3"/>
    </g>

    <!-- Team members around whiteboard -->
    <!-- Person 1 - Left, pointing at board -->
    <g transform="translate(-30, 390)" filter="url(#softShadow)">
      <circle cx="20" cy="12" r="14" fill="#4338ca"/>
      <rect x="4" y="26" width="32" height="40" rx="6" fill="url(#person1Grad)" opacity="0.9"/>
      <line x1="4" y1="38" x2="-20" y2="28" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <line x1="36" y1="38" x2="55" y2="32" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
      <!-- Face -->
      <ellipse cx="14" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <ellipse cx="26" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <path d="M17,16 Q20,19 23,16" stroke="#c7d2fe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Person 2 - Right, holding tablet -->
    <g transform="translate(550, 385)" filter="url(#softShadow)">
      <circle cx="20" cy="12" r="14" fill="#5b21b6"/>
      <rect x="4" y="26" width="32" height="40" rx="6" fill="url(#person2Grad)" opacity="0.9"/>
      <line x1="4" y1="38" x2="-15" y2="32" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
      <line x1="36" y1="38" x2="55" y2="28" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <!-- Tablet in hand -->
      <g transform="translate(60, 22) rotate(15)">
        <rect x="-12" y="-8" width="24" height="18" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <rect x="-9" y="-5" width="18" height="12" rx="2" fill="url(#tabletGrad)" opacity="0.7"/>
        <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#fff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
        <line x1="-5" y1="1" x2="3" y2="1" stroke="#fff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
      </g>
      <!-- Face -->
      <ellipse cx="14" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <ellipse cx="26" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <path d="M17,16 Q20,19 23,16" stroke="#c7d2fe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Person 3 - Center back, presenting -->
    <g transform="translate(270, 370)" filter="url(#softShadow)">
      <circle cx="20" cy="12" r="14" fill="#3730a3"/>
      <rect x="4" y="26" width="32" height="40" rx="6" fill="url(#person3Grad)" opacity="0.85"/>
      <line x1="4" y1="38" x2="-10" y2="30" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <line x1="36" y1="38" x2="50" y2="30" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <!-- Face -->
      <ellipse cx="14" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <ellipse cx="26" cy="10" rx="2.5" ry="3" fill="#c7d2fe" opacity="0.5"/>
      <path d="M17,16 Q20,19 23,16" stroke="#c7d2fe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Thought bubbles -->
    <g transform="translate(-50, 350)" opacity="0.2">
      <ellipse cx="15" cy="12" rx="14" ry="10" fill="#fff"/>
      <circle cx="8" cy="28" r="4" fill="#fff"/>
      <circle cx="4" cy="36" r="3" fill="#fff"/>
      <circle cx="18" cy="36" r="3" fill="#fff"/>
    </g>
  </g>

  <!-- Main headline - F-pattern, top-left -->
  <text x="720" y="110" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#fff" letter-spacing="1">
    TRANSFORMING
  </text>
  <text x="720" y="170" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#fff" letter-spacing="1">
    <tspan fill="url(#brandGrad)">STUDENT</tspan> LEARNING
  </text>
  
  <!-- Subtitle -->
  <text x="720" y="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a5b4fc" letter-spacing="2.5">
    DEEP FOCUS · SMART TOOLS · COMMUNITY DRIVEN
  </text>
  
  <!-- Accent line -->
  <rect x="720" y="240" width="90" height="4" rx="2" fill="url(#brandGrad)"/>

  <!-- Description text -->
  <text x="720" y="280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="300" fill="#94a3b8" letter-spacing="0.5">
    <tspan x="720" dy="0">Meet the team behind StudeQ. We're building a platform</tspan>
    <tspan x="720" dy="24">that makes deep, focused studying accessible to every</tspan>
    <tspan x="720" dy="24">university student through smart tools and community-</tspan>
    <tspan x="720" dy="24">driven design.</tspan>
  </text>

  <!-- CTA / brand tag -->
  <g transform="translate(720, 400)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="url(#brandGrad)" filter="url(#softShadow)"/>
    <text x="90" y="28" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1.5">
      ABOUT STUDEQ
    </text>
  </g>

  <!-- Bottom brand bar -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#brandGrad)" opacity="0.1"/>
  
  <!-- StudeQ logo text bottom left -->
  <text x="40" y="615" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6366f1" letter-spacing="2.5">
    STUDEQ
  </text>
  
  <!-- URL bottom right -->
  <text x="1160" y="615" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="300" fill="#64748b" text-anchor="end" letter-spacing="1.5">
    studeq.onrender.com
  </text>

  <!-- Decorative corner dots -->
  <circle cx="690" cy="90" r="2" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="690" cy="100" r="2" fill="#6366f1" opacity="0.15"/>
  <circle cx="690" cy="110" r="2" fill="#4f46e5" opacity="0.1"/>
</svg>