<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F23"/>
      <stop offset="50%" stop-color="#1A1A3E"/>
      <stop offset="100%" stop-color="#0D0D2B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B5CFC"/>
      <stop offset="100%" stop-color="#4F3CF5"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7B5CFC"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0D8FF"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5CFC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B5CFC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7B5CFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.36  0 0 0 0 0.99  0 0 0 0.3 0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#7B5CFC" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Ambient glow behind shield -->
  <ellipse cx="560" cy="310" rx="250" ry="220" fill="#7B5CFC" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Shield shape - main hero element (40-60% canvas) -->
  <g filter="url(#glow)">
    <!-- Shield outer -->
    <path d="M560 80 L740 140 L740 350 Q740 520 560 580 Q380 520 380 350 L380 140 Z"
          fill="url(#shieldGrad)" opacity="0.15" stroke="#7B5CFC" stroke-width="2"/>

    <!-- Shield inner (slightly smaller) -->
    <path d="M560 115 L710 168 L710 345 Q710 495 560 545 Q410 495 410 345 L410 168 Z"
          fill="url(#shieldGrad)" opacity="0.9" stroke="#A78BFA" stroke-width="1.5"/>

    <!-- Shield highlight edge -->
    <path d="M560 115 L710 168 L710 345 Q710 495 560 545"
          fill="none" stroke="#C4B5FD" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Lock icon inside shield -->
  <g transform="translate(560, 315)">
    <!-- Lock body -->
    <rect x="-40" y="-10" width="80" height="65" rx="10" fill="url(#lockGrad)" opacity="0.95"/>

    <!-- Lock shackle -->
    <path d="M-25 -10 L-25 -40 A25 25 0 0 1 25 -40 L25 -10"
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.95"/>

    <!-- Keyhole -->
    <circle cx="0" cy="22" r="9" fill="#4F3CF5"/>
    <rect x="-4" y="22" width="8" height="16" rx="2" fill="#4F3CF5"/>

    <!-- Lock shine -->
    <rect x="-30" y="0" width="15" height="40" rx="7" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- Decorative data nodes around shield -->
  <g opacity="0.5">
    <circle cx="320" cy="200" r="4" fill="#7B5CFC"/>
    <circle cx="320" cy="200" r="8" fill="none" stroke="#7B5CFC" stroke-width="0.8" opacity="0.4"/>

    <circle cx="800" cy="200" r="4" fill="#7B5CFC"/>
    <circle cx="800" cy="200" r="8" fill="none" stroke="#7B5CFC" stroke-width="0.8" opacity="0.4"/>

    <circle cx="320" cy="420" r="4" fill="#A78BFA"/>
    <circle cx="320" cy="420" r="8" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.4"/>

    <circle cx="800" cy="420" r="4" fill="#A78BFA"/>
    <circle cx="800" cy="420" r="8" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.4"/>

    <circle cx="560" cy="80" r="3" fill="#C4B5FD"/>
    <circle cx="560" cy="80" r="6" fill="none" stroke="#C4B5FD" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#7B5CFC" stroke-width="1" opacity="0.2">
    <line x1="328" y1="200" x2="410" y2="220"/>
    <line x1="792" y1="200" x2="710" y2="220"/>
    <line x1="328" y1="420" x2="410" y2="380"/>
    <line x1="792" y1="420" x2="710" y2="380"/>
    <line x1="560" y1="86" x2="560" y2="115"/>
  </g>

  <!-- Accent divider line -->
  <line x1="80" y1="160" x2="350" y2="160" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Text zone - left side, clear negative space -->
  <g>
    <!-- "StudeQ" brand text -->
    <text x="80" y="145" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="800" font-size="36" fill="#C4B5FD" letter-spacing="4">
      StudeQ
    </text>

    <!-- Main keyword "DATA PROTECTION" - largest, boldest -->
    <text x="80" y="240" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="1">
      DATA
    </text>
    <text x="80" y="300" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="1">
      PROTECTION
    </text>

    <!-- Subheading -->
    <text x="80" y="345" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="500" font-size="22" fill="#A78BFA" letter-spacing="0.5">
      Your privacy is our priority
    </text>

    <!-- Privacy tagline -->
    <text x="80" y="510" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="400" font-size="16" fill="#6B6B8A" letter-spacing="1.5">
      ENCRYPTED · SECURE · TRUSTED BY STUDENTS
    </text>

    <!-- Small shield dots decorative -->
    <g opacity="0.3">
      <circle cx="80" cy="530" r="2" fill="#7B5CFC"/>
      <circle cx="95" cy="530" r="2" fill="#7B5CFC"/>
      <circle cx="110" cy="530" r="2" fill="#7B5CFC"/>
    </g>
  </g>

  <!-- Right side small data-protection badges -->
  <g opacity="0.6">
    <rect x="850" y="530" width="120" height="36" rx="18" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
    <text x="910" y="553" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="600" font-size="13" fill="#A78BFA" text-anchor="middle" letter-spacing="2">
      SSL 256-BIT
    </text>
  </g>
  <g opacity="0.6">
    <rect x="980" y="530" width="140" height="36" rx="18" fill="none" stroke="#7B5CFC" stroke-width="1.5"/>
    <text x="1050" y="553" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="600" font-size="13" fill="#A78BFA" text-anchor="middle" letter-spacing="2">
      GDPR READY
    </text>
  </g>

  <!-- Bottom accent line -->
  <line x1="80" y1="585" x2="1120" y2="585" stroke="url(#accentLine)" stroke-width="1.5"/>
</svg>