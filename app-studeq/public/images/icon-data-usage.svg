<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B5CFC"/>
      <stop offset="100%" stop-color="#4F3CF5"/>
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7B5CFC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4F3CF5"/>
      <stop offset="100%" stop-color="#7B5CFC"/>
    </linearGradient>
  </defs>

  <!-- Document body -->
  <rect x="5" y="3" width="22" height="25" rx="3" fill="url(#docGrad)" stroke="#7B5CFC" stroke-width="0.8"/>

  <!-- Document fold -->
  <path d="M22 3L27 8H24C22.9 8 22 7.1 22 6V3Z" fill="#D4CCFF" stroke="#7B5CFC" stroke-width="0.5"/>

  <!-- Bar chart inside document (data usage visualization) -->
  <!-- Bar 1 -->
  <rect x="9" y="18" width="3" height="6" rx="0.8" fill="url(#chartGrad1)" opacity="0.8"/>
  <!-- Bar 2 (tallest - primary highlight) -->
  <rect x="14" y="14" width="3" height="10" rx="0.8" fill="url(#accentGrad)"/>
  <!-- Bar 3 -->
  <rect x="19" y="17" width="3" height="7" rx="0.8" fill="url(#chartGrad2)" opacity="0.8"/>

  <!-- Processing arrows - data flowing out/being used -->
  <!-- Arrow top-right -->
  <path d="M27.5 8.5L30 7L27.5 5.5" fill="none" stroke="#7B5CFC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 7H26" fill="none" stroke="#7B5CFC" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Arrow right -->
  <path d="M27.5 15L30 16L27.5 17" fill="none" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 16H28" fill="none" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Arrow bottom-right -->
  <path d="M27 22L29 23.5L27 25" fill="none" stroke="#7B5CFC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29 23.5H25" fill="none" stroke="#7B5CFC" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Small data dots -->
  <circle cx="2.5" cy="6" r="1.5" fill="#7B5CFC" opacity="0.6"/>
  <circle cx="3" cy="16" r="1.5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="2.5" cy="26" r="1.5" fill="#4F3CF5" opacity="0.6"/>

  <!-- Incoming data indicator lines -->
  <line x1="2.5" y1="6" x2="7" y2="10" stroke="#7B5CFC" stroke-width="0.7" opacity="0.4"/>
  <line x1="3" y1="16" x2="7" y2="15" stroke="#A78BFA" stroke-width="0.7" opacity="0.4"/>
  <line x1="2.5" y1="26" x2="7" y2="23" stroke="#4F3CF5" stroke-width="0.7" opacity="0.4"/>
</svg>